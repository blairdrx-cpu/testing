<script>
  (function () {
    var form = document.getElementById('form');
    var gate = document.getElementById('gate');
    var videos = document.getElementById('videos');
    var errBox = document.getElementById('err');
    var btn = document.getElementById('btn');
    var KEY = 'trd_mini_unlocked';

    /* ActiveCampaign master-list config (account "blairdrx", form 18) */
    var AC_URL = 'https://blairdrx.activehosted.com/proc.php';
    var AC_HIDDEN = { u:'18', f:'18', s:'', c:'0', m:'0', act:'sub', v:'2', or:'39f90d2f-508b-462b-960a-7e8615f0a935' };

    window.cfields = window.cfields || [];

    window._show_unsubscribe = window._show_unsubscribe || function(){};
    window._show_pc_confirmation = window._show_pc_confirmation || function(){};
    window._show_error = window._show_error || function(){};
    window._load_script = window._load_script || function(u){ var s=document.createElement('script'); s.src=u; document.head.appendChild(s); };

    function subscribeToAC(name, email){
      var p = Object.assign({}, AC_HIDDEN, { fullname:name, email:email });
      var qs = Object.keys(p).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(p[k]); }).join('&');
      var s = document.createElement('script');
      s.src = AC_URL + '?' + qs + '&jsonp=true';
      document.body.appendChild(s);
    }

    function report(){
      var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      parent.postMessage({ __trdHeight: h }, '*');
    }

    function reveal(){
      gate.style.display = 'none';
      videos.classList.add('is-open');
      report();
      setTimeout(report, 120);
    }

    try { if (localStorage.getItem(KEY) === '1') reveal(); } catch(e){}

    form.addEventListener('submit', function(e){
      e.preventDefault();
      errBox.textContent = '';
      var name = document.getElementById('nm').value.trim();
      var email = document.getElementById('em').value.trim();
      var ok = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);
      if (!name){ errBox.textContent = 'Please enter your name.'; report(); return; }
      if (!ok){ errBox.textContent = 'Please enter a valid email address.'; report(); return; }
      btn.disabled = true; btn.textContent = 'Unlocking\\u2026';
      subscribeToAC(name, email);
      try { localStorage.setItem(KEY, '1'); } catch(e){}
      reveal();
    });

    window.addEventListener('load', report);
    window.addEventListener('resize', report);
    if (window.ResizeObserver){ try { new ResizeObserver(report).observe(document.body); } catch(e){} }
    setTimeout(report, 300); setTimeout(report, 1200); setTimeout(report, 2500);

  var frame = document.getElementById('trdFrame');

  window.addEventListener('message', function (e) {
    if (e && e.data && typeof e.data.__trdHeight === 'number') {
      frame.style.height = e.data.__trdHeight + 'px';
    }
  });
})();
