     Kajabi Custom HTML block — all colors use !important to override

<style>
/* ─── TESTIMONIALS ─── */

.trd-proof {
  background: #060102 !important;
  padding: 72px 24px !important;
}

/* Force background on any wrapper Kajabi wraps around the block */
.trd-proof *,
.trd-proof *::before,
.trd-proof *::after {
  box-sizing: border-box !important;
}

.trd-proof .trd-label {
  color: #FF8C42 !important;
}

.trd-proof .trd-h2 {
  color: #FFEFCC !important;
}

.trd-proof-grid {
  display: grid !important;
  grid-template-columns: repeat(2, 1fr) !important;
  gap: 20px !important;
  max-width: 960px !important;
  margin: 0 auto !important;
}

.trd-quote {
  background: #ffffff !important;
  border-radius: 10px !important;
  padding: 2rem 1.75rem !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 16px !important;
  border: 1px solid rgba(0, 0, 0, 0.07) !important;
}

.trd-quote-mark {
  font-size: 36px !important;
  color: #FF8C42 !important;
  font-family: Georgia, serif !important;
  line-height: 1 !important;
}

.trd-quote-text {
  font-size: 15px !important;
  color: #2a2017 !important;
  line-height: 1.75 !important;
  font-style: italic !important;
  flex: 1 !important;
}

.trd-quote-author {
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  border-top: 1px solid rgba(0, 0, 0, 0.08) !important;
  padding-top: 14px !important;
}

.trd-quote-author img {
  width: 42px !important;
  height: 42px !important;
  border-radius: 50% !important;
  object-fit: cover !important;
  flex-shrink: 0 !important;
}

.trd-quote-author-name {
  font-size: 13px !important;
  font-weight: 600 !important;
  color: #2C5F6F !important;
}

/* ─── MOBILE ─── */
@media (max-width: 768px) {
  .trd-proof {
    background: #060102 !important;
    padding: 48px 16px !important;
  }

  .trd-proof-grid {
    grid-template-columns: 1fr !important;
  }

  .trd-quote {
    background: #ffffff !important;
    padding: 1.5rem 1.25rem !important;
  }

  .trd-quote-mark {
    color: #FF8C42 !important;
  }

  .trd-quote-text {
    color: #2a2017 !important;
    font-size: 14px !important;
  }

  .trd-quote-author-name {
    color: #2C5F6F !important;
  }

  .trd-proof .trd-label {
    color: #FF8C42 !important;
  }

  .trd-proof .trd-h2 {
    color: #FFEFCC !important;
  }
}
</style>
